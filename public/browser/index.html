<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MSX Browser</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#fff;font:18px Arial,sans-serif;overflow:hidden}header{height:82px;display:flex;gap:10px;align-items:center;padding:12px;background:#11151a;border-bottom:1px solid #2a3038}.brand{font-weight:700;font-size:24px;min-width:155px}.address{flex:1;height:54px;border:2px solid #3b4350;border-radius:12px;background:#1a1f26;color:#fff;padding:0 18px;font-size:20px;outline:none}.address:focus{border-color:#fff}.btn{height:54px;min-width:54px;border:0;border-radius:12px;background:#222932;color:#fff;font-size:24px;cursor:pointer}.btn:focus,.btn:hover{outline:3px solid #fff;outline-offset:2px}.search{min-width:120px;font-size:18px}.bar{height:48px;display:flex;align-items:center;gap:8px;padding:6px 12px;background:#151a20}.bar button{height:36px;padding:0 14px;border:0;border-radius:8px;background:#252d36;color:#fff;font-size:16px}.bar button:focus{outline:2px solid #fff}.frame{width:100vw;height:calc(100vh - 130px);border:0;background:#fff}.notice{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#151a20;border:1px solid #38414c;border-radius:14px;padding:24px;max-width:560px;text-align:center;display:none}.notice button{margin-top:16px;padding:12px 20px;border:0;border-radius:8px;background:#fff;color:#111;font-size:18px}
</style>
</head>
<body>
<header>
<div class="brand">🌐 MSX Browser</div>
<button class="btn" id="back" title="Back">‹</button>
<button class="btn" id="forward" title="Forward">›</button>
<button class="btn" id="reload" title="Reload">↻</button>
<input id="address" class="address" autocomplete="off" spellcheck="false" placeholder="Search Google or enter a URL">
<button class="btn search" id="go">Go</button>
</header>
<div class="bar">
<button id="home">Home</button><button id="google">Google</button><button id="bing">Bing</button><button id="bookmark">★ Bookmark</button><button id="open">Open directly</button><span id="status" style="margin-left:auto;opacity:.7">Ready</span>
</div>
<iframe id="web" class="frame" title="Web browser" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; microphone" allowfullscreen></iframe>
<div id="notice" class="notice"><b>This website doesn't allow embedded browsers.</b><br><br>Use <b>Open directly</b> to navigate to it in the TV's supported web context.</div>
<script>
const frame=document.getElementById('web'), address=document.getElementById('address'), status=document.getElementById('status'), notice=document.getElementById('notice');
const HOME='https://www.google.com/';
let current=HOME;
let bookmarks=JSON.parse(localStorage.getItem('msxBookmarks')||'[]');
function normalize(v){v=v.trim();if(!v)return HOME;if(/^https?:\/\//i.test(v))return v;if(/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(v))return 'https://'+v;return 'https://www.google.com/search?q='+encodeURIComponent(v)}
function load(v){current=normalize(v);address.value=current;status.textContent='Loading…';notice.style.display='none';frame.src=current}
function openDirect(){window.location.href=current}
frame.addEventListener('load',()=>{status.textContent='Loaded';notice.style.display='none'});
frame.addEventListener('error',()=>{status.textContent='Blocked';notice.style.display='block'});
document.getElementById('go').onclick=()=>load(address.value);
address.addEventListener('keydown',e=>{if(e.key==='Enter')load(address.value)});
document.getElementById('home').onclick=()=>load(HOME);
document.getElementById('google').onclick=()=>load('https://www.google.com/');
document.getElementById('bing').onclick=()=>load('https://www.bing.com/');
document.getElementById('reload').onclick=()=>frame.contentWindow.location.reload();
document.getElementById('back').onclick=()=>{try{frame.contentWindow.history.back()}catch(e){}};
document.getElementById('forward').onclick=()=>{try{frame.contentWindow.history.forward()}catch(e){}};
document.getElementById('open').onclick=openDirect;
document.getElementById('bookmark').onclick=()=>{if(!bookmarks.includes(current)){bookmarks.push(current);localStorage.setItem('msxBookmarks',JSON.stringify(bookmarks));status.textContent='Bookmarked'}else status.textContent='Already bookmarked'};
load(HOME);
</script>
</body>
</html>
