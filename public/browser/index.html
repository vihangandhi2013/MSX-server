<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MSX Browser</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#fff;font:18px Arial,sans-serif;overflow:hidden}header{height:82px;display:flex;gap:9px;align-items:center;padding:12px;background:#11151a}.brand{font-weight:700;font-size:24px;min-width:155px}.address{flex:1;height:54px;border:2px solid #3b4350;border-radius:12px;background:#1a1f26;color:#fff;padding:0 18px;font-size:20px}.btn,.bar button{border:0;border-radius:10px;background:#252d36;color:#fff;cursor:pointer}.btn{height:54px;min-width:54px;font-size:24px}.btn:focus,.bar button:focus,.address:focus{outline:3px solid #fff}.bar{height:50px;display:flex;align-items:center;gap:8px;padding:6px 12px;background:#151a20}.bar button{height:38px;padding:0 14px;font-size:16px}.frame{width:100vw;height:calc(100vh - 132px);border:0;background:#fff}.panel{position:absolute;z-index:4;right:16px;top:145px;background:#151a20;border:1px solid #46505d;border-radius:14px;padding:18px;width:330px;display:none}.panel input{width:100%;padding:12px;border-radius:8px;border:0;font-size:17px}.panel button{margin-top:10px;padding:11px 15px;border:0;border-radius:8px;background:#fff;color:#111;font-weight:bold}.qr{background:#fff;padding:10px;width:220px;margin:12px auto}.qr img{width:200px;height:200px;display:block}.status{margin-left:auto;opacity:.7}</style></head><body><header><div class="brand">🌐 MSX Browser</div><button class="btn" id="back">‹</button><button class="btn" id="forward">›</button><button class="btn" id="reload">↻</button><input id="address" class="address" autocomplete="off" spellcheck="false" placeholder="Search Google or enter a URL"><button class="btn" id="go">Go</button></header><div class="bar"><button id="home">Home</button><button id="google">Google</button><button id="bing">Bing</button><button id="bookmark">★ Bookmark</button><button id="qrBtn">📱 Phone QR</button><button id="iptv">📺 IPTV</button><button id="mouse">🖱️ Mouse</button><span id="status" class="status">Ready</span></div><iframe id="web" class="frame" title="Web browser" allow="autoplay;fullscreen;picture-in-picture;encrypted-media;microphone" allowfullscreen></iframe><div id="panel" class="panel"><b id="panelTitle">Phone</b><div id="panelBody"></div></div><script>const frame=document.getElementById('web'),address=document.getElementById('address'),status=document.getElementById('status'),panel=document.getElementById('panel'),body=document.getElementById('panelBody');const HOME='https://www.google.com/';let current=HOME;let bookmarks=JSON.parse(localStorage.getItem('msxBookmarks')||'[]');function normalize(v){v=v.trim();if(!v)return HOME;if(/^https?:\/\//i.test(v))return v;if(/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(v))return'https://'+v;return'https://www.google.com/search?q='+encodeURIComponent(v)}function load(v){current=normalize(v);address.value=current;status.textContent='Loading…';frame.src=current}function show(title,html){document.getElementById('panelTitle').textContent=title;body.innerHTML=html;panel.style.display='block'}function closePanel(){panel.style.display='none'}document.getElementById('go').onclick=()=>load(address.value);address.onkeydown=e=>{if(e.key==='Enter')load(address.value)};document.getElementById('home').onclick=()=>load(HOME);document.getElementById('google').onclick=()=>load('https://www.google.com/');document.getElementById('bing').onclick=()=>load('https://www.bing.com/');document.getElementById('reload').onclick=()=>{frame.src=frame.src};document.getElementById('back').onclick=()=>{try{frame.contentWindow.history.back()}catch(e){}};document.getElementById('forward').onclick=()=>{try{frame.contentWindow.history.forward()}catch(e){}};document.getElementById('bookmark').onclick=()=>{if(!bookmarks.includes(current)){bookmarks.push(current);localStorage.setItem('msxBookmarks',JSON.stringify(bookmarks));status.textContent='Bookmarked'}else status.textContent='Already bookmarked'};document.getElementById('qrBtn').onclick=()=>{const u=location.origin+'/browser/phone.html';show('Scan with your phone','<p>Scan this QR code, then enter the URL you want to open on the TV.</p><div class="qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(u)+'"></div><small>'+u+'</small><br><button onclick="closePanel()">Close</button>')};document.getElementById('iptv').onclick=()=>show('IPTV Player','<p>Enter an M3U playlist URL you are permitted to use.</p><input id="playlist" placeholder="https://example.com/playlist.m3u"><br><button onclick="openPlaylist()">Open</button> <button onclick="closePanel()">Close</button>');window.openPlaylist=()=>{const u=document.getElementById('playlist').value.trim();if(u){closePanel();load(u)}};document.getElementById('mouse').onclick=()=>show('Virtual Mouse','<p>Use your phone as a pointer or use the TV remote. Full mouse control depends on VIDAA/MSX WebView capabilities.</p><button onclick="closePanel()">Close</button>');frame.onload=()=>status.textContent='Loaded';load(new URLSearchParams(location.search).get('url')||HOME);</script></body></html>
