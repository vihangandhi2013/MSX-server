<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSX Browser Remote</title><style>body{font-family:Arial;background:#0b0d10;color:white;padding:24px}input,button{width:100%;padding:16px;margin:8px 0;border:0;border-radius:10px;font-size:18px}input{box-sizing:border-box}button{background:#fff;color:#111;font-weight:bold}small{opacity:.65}</style></head><body><h1>📱 MSX Browser Remote</h1><p>Enter the website or search you want to open on the TV.</p><input id="u" placeholder="https://example.com or search"><button onclick="send()">Open on TV</button><p id="s"></p><small>The phone and TV must be able to reach the same MSX browser service. This page prepares the URL; a live push channel requires a shared remote backend.</small><script>function send(){const v=document.getElementById('u').value.trim();if(!v)return;localStorage.setItem('msxRemoteUrl',v);document.getElementById('s').textContent='URL saved: '+v+' — return to the TV browser and it can use this value.'}</script></body></html>
